name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project Muyynguyennn.xcodeproj \
            -scheme Muyynguyennn \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          mkdir -p artifact
          APP_PATH=$(find build -type d -name "Muyynguyennn.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
          echo "Không tìm thấy Muyynguyennn.app"
          find build -maxdepth 5 -type d | head -100
          exit 1
          fi
          cp -R "$APP_PATH" artifact/Muyynguyennn.app

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Muyynguyennn-iOS-Simulator
          path: artifact/
